name: cluster

# Heavy clustering runs IN the runner (§3): embeds headline+dek locally with
# all-MiniLM-L6-v2, clusters within a rolling window, ranks, and generates
# computed recaps — all writing directly to Postgres.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-cluster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run cluster job
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: pnpm job:cluster
