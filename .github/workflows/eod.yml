name: eod

# End-of-day candles, retention prune, integrity checks (§3). Also wired as the
# single daily Vercel cron in vercel.json so the Vercel-native path stays exercised.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: cron-eod
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/eod
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is not set. Add it in Settings → Secrets and variables → Actions (see DEPLOY.md §2c). Use the STABLE production domain, not a preview URL."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set (it must match the value configured in Vercel)."
            exit 1
          fi
          code=$(curl --show-error --silent --retry 3 --retry-delay 8 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o response.txt -w '%{http_code}' \
            "${APP_URL%/}/api/cron/eod") || true
          echo "HTTP ${code} from ${APP_URL%/}/api/cron/eod"
          head -c 600 response.txt || true; echo
          if [ "${code}" != "200" ]; then
            echo "::error::Expected 200. 401 = CRON_SECRET mismatch or Vercel Deployment Protection; 404 = wrong APP_URL or route not deployed."
            exit 1
          fi
