name: eod

# End-of-day candles, retention prune, integrity checks (§3). Also wired as the
# single daily Vercel cron in vercel.json so the Vercel-native path stays exercised.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: cron-eod
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/eod
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 8 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/eod"
