name: ingest

# Heavy ingest runs IN the runner (§3): full Node, no serverless timeout,
# writing directly to Postgres. Pulls feeds, dedupes, classifies, stores
# headline metadata (never body text).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ingest job
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: pnpm job:ingest
