name: macro

# FRED + World Bank series refresh every 6 hours (§3).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: cron-macro
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/macro
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 4 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/macro"
