name: quotes

# Refresh quote/index/FX caches on a real intraday schedule (§3). Vercel Hobby
# can't run sub-daily cron, so GitHub Actions calls the authenticated route.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-quotes
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/quotes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is not set. Add it in Settings → Secrets and variables → Actions (see DEPLOY.md §2c). Use the STABLE production domain, not a preview URL."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set (it must match the value configured in Vercel)."
            exit 1
          fi
          code=$(curl --show-error --silent --retry 3 --retry-delay 4 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o response.txt -w '%{http_code}' \
            "${APP_URL%/}/api/cron/quotes") || true
          echo "HTTP ${code} from ${APP_URL%/}/api/cron/quotes"
          head -c 600 response.txt || true; echo
          if [ "${code}" != "200" ]; then
            echo "::error::Expected 200. 401 = CRON_SECRET mismatch or Vercel Deployment Protection; 404 = wrong APP_URL or route not deployed."
            exit 1
          fi
