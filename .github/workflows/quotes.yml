name: quotes

# Refresh quote/index/FX caches on a real intraday schedule (§3). Vercel Hobby
# can't run sub-daily cron, so GitHub Actions calls the authenticated route.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-quotes
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/quotes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 4 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/quotes"
