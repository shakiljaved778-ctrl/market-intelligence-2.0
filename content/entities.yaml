# Entity dictionary (§9 Stage 2) — committed and reviewable, not inferred magic.
# Each entity has a canonical name, a kind, and aliases matched case-insensitively
# against headline + dek.

entities:
  - name: Federal Reserve
    kind: central_bank
    aliases:
      [
        Fed,
        FOMC,
        Federal Open Market Committee,
        U.S. Federal Reserve,
        US central bank,
        U.S. central bank,
      ]
  - name: European Central Bank
    kind: central_bank
    aliases: [ECB]
  - name: Bank of England
    kind: central_bank
    aliases: [BoE]
  - name: Qatar Central Bank
    kind: central_bank
    aliases: [QCB]
