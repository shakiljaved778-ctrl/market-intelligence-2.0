    kind: regulator
    aliases: [SEC, Securities and Exchange Commission]
  - name: OPEC
    kind: institution
    aliases: [OPEC+, Organization of the Petroleum Exporting Countries]
  - name: S&P 500
    kind: index
    aliases: [S&P, SPX, S&P 500 Index]
  - name: Nasdaq
    kind: index
    aliases: [Nasdaq Composite, Nasdaq 100, NDX]
  - name: Brent Crude
    kind: commodity
    aliases: [Brent, Brent oil]
