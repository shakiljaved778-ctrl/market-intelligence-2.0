# Editorial exclusions (owner decision, 2026-11-19 — "a strict no").
#
# Mizaan does not publish:
#   1. news about the Qatar Central Bank (QCB), from any source; or
#   2. anything about Qatar politics, government or diplomacy.
#
# Applied DETERMINISTICALLY (lib/curation/exclusions.ts), no model:
#   - at ingest: a matching item is never stored;
#   - in the cluster job: a matching stored item is never clustered or written up;
#   - at read time: a matching story already stored is hidden from every list
#     and its page returns 404;
#   - on AI articles: a draft that mentions a banned term is rewritten once,
#     then discarded.
#
# Matching is case-insensitive on whole words/phrases, over the headline, dek
# and (for read-time checks) every clustered report.
#
# `always` terms exclude a story wherever it comes from (QCB, and names that
# only ever mean Qatar's head of state or government).
# `qatar_politics` terms exclude a story only when it is Qatar-related: the text
# names Qatar/Doha/a Qatari, or the source is a Qatar-registered feed (region QA
# in content/sources.yaml). A Fed or ECB story that says "prime minister" about
# another country is unaffected.

always:
  - Qatar Central Bank
  - Qatar's Central Bank
  - Central Bank of Qatar
  - QCB
  - QCB's
  - مصرف قطر المركزي
  # Names and offices that only ever mean Qatar's head of state or government.
  - Sheikh Tamim
  - Tamim bin Hamad
  - Father Amir
  - Amiri Diwan
  - Sheikh Hamad bin Khalifa
  - Sheikh Abdullah bin Hamad
  - Sheikh Mohammed bin Abdulrahman
  - Al Khulaifi

qatar_markers:
  - Qatar
  - Qatari
  - Qataris
  - Doha
  - قطر

# Tier 1 — government and diplomacy. Excludes a story when it is Qatar-related:
# the text names Qatar, or the source is a Qatar feed (QNA's agency copy often
# omits the country name: "HH the Amir Receives …").
qatar_politics:
  # Head of state and government
  - Amir
  - Emir
  - Deputy Amir
  - Amiri
  - Emiri
  - His Highness
  - HH
  - Prime Minister
  - Deputy Prime Minister
  - Foreign Minister
  - Foreign Affairs
  - Ministry of Foreign Affairs
  - Foreign Ministry
  - MoFA
  - Minister of Interior
  - Ministry of Interior
  - Interior Ministry
  - Minister of Defence
  - Minister of Defense
  - Ministry of Defence
  - Ministry of Defense
  - Defence Ministry
  - Defense Ministry
  - Cabinet
  - Council of Ministers
  - Shura Council
  - Shura
  - Amiri Decree
  - Emiri Decree
  - government spokesperson
  - official spokesperson
  # Diplomacy and international relations
  - ambassador
  - ambassadors
  - embassy
  - consul
  - consulate
  - envoy
  - diplomat
  - diplomatic
  - diplomacy
  - bilateral relations
  - bilateral ties
  - ties with
  - strategic dialogue
  - official delegation
  - government delegation
  - ministerial delegation
  - parliamentary delegation
  - credentials
  - condolences
  - congratulates
  - congratulatory
  - phone call
  - official visit
  - state visit
  - mediation
  - mediator
  - ceasefire
  - truce
  - hostages
  - peace talks
  - UN Security Council
  - Arab League
  - GCC Ministerial Council
  - GCC Supreme Council

# Tier 2 — general political words. These also appear in market copy about
# other countries ("Italy's political stability", "geopolitical risk" in an oil
# report), so they exclude a story only when its TEXT names Qatar.
qatar_politics_text:
  - politics
  - political
  - geopolitical
  - election
  - elections
  - parliament
  - parliamentary
  - legislative
  - opposition
  - military
  - armed forces
  - security forces
  - sanctions
  - summit
  - summits

# Diplomatic meetings by any minister ("Minister of Commerce Meets Georgia's
# Deputy Prime Minister"): a minister or ministry together with one of these
# meeting verbs, in a Qatar-related story. Ministers opening, attending or
# signing at business events are economy news and are not matched (2026-11-19
# tuning, from the probe of QNA's economy feed).
minister_meeting_verbs:
  - meets
  - met with
  - meeting with
  - receives
  - received
  - holds talks
  - held talks
