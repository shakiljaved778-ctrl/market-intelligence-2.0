# Mizan — content sections (§9, §13).
#
# Sections are the top-level editorial verticals of the site. Assignment is
# DETERMINISTIC and keyword-driven (see lib/curation/section.ts) — no model,
# consistent with the V1 "no LLM" invariant. A section is derived from the
# cluster's title/dek/topics/tickers, exactly like topics and entities.
#
# Editorial mix (product rule): Mizan is a market-intelligence product, so
# markets/economy dominate — but at least ~30% of the wire is deliberately
# NON-FINANCIAL (technology, sports, health, entertainment, science) to keep a
# broad audience engaged. `financial: false` marks those verticals; the ratio is
# guarded by a test (lib/curation/section.test.ts).
#
# KEYWORD MATCHING (lib/curation/section.ts): a keyword matches as a whole token.
# A keyword written in CAPITALS or with a capital initial (WHO, NASA, Mars,
# "Bank of England") is matched CASE-SENSITIVELY — so "WHO" never matches the
# word "who". All-lower-case keywords match in any case. A match in the headline
# scores more than a match in the description; the highest score wins.
#
# `hue` is an editorial SECTION tint used ONLY inside cover art and the section
# tag — never on chrome and never on data. It is intentionally muted and avoids
# gain-green / loss-red so it can never be confused with price direction (§12).

