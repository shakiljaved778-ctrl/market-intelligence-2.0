# Gulf sources under assessment (Phase 2). NOTHING here is ingested: a source
# moves to content/sources.yaml only after its terms of use have been read, its
# robots.txt allows us, and it has a working feed or an API we may use.
#
# `scripts/probe-sources.ts` (run by .github/workflows/probe-sources.yml on
# GitHub, where these sites are reachable) checks robots.txt, fetches each URL,
# parses it if it is a feed, and lists any feed links if it is a web page.
#
# Probe results, 2026-11-13 (GitHub Actions runs 43439141971 and 43439826314):
#   qna-economy-local / -international  ADDED to sources.yaml — robots allow, HTTP
#                                       200, RSS 2.0 with fresh items.
#   wam-home, spa-home, cma-sa-news     robots allow, page loads, no feed found.
#   qcb-news, sama-news                 site unreachable from the runner.
#   qfma-news                           news URL returns 404.
#   sca-news                            redirects to a "page not found" page.
#   cbuae-news, adx-home,               HTTP 403 to automated requests — skipped;
#   saudi-exchange-news                 we do not work around a block.
#   qse-home                            robots.txt unreachable, no feed found.
#   dfm-home                            only a YouTube feed — not news text.
# Probe run 5, 2026-11-14:
#   qna-qatar / -general / -analysis   robots allow, HTTP 200, all dated — NOT
#                                      added: mostly Qatar politics, excluded by
#                                      the owner (2026-11-19).
#   treasury-press, worldbank-news,    switched OFF in sources.yaml: Treasury's
#   cdc-newsroom                       feed times out (no feed on its page); the
#                                      World Bank URL now returns HTML; the CDC
#                                      feed is an old COVID-19 feed, 0 items.
# YouTube channels probe, 2026-11-20 (run 44684967386): oEmbed of an uploads
#   playlist returns the newest video's thumbnail + channel name (keyless);
#   official channels confirmed and added to content/videos.yaml: World Bank
#   Group, OECD, WTO, WEF, Nasdaq, Qatar Stock Exchange, ADGM. Rejected:
#   @opec/@iea/@difc/@adxuae (someone else's), @ecb/@bisbank/@ustreasury/
#   @secgov/@bankofcanada/@reservebankofaustralia/@bankofjapan/
#   @saudiexchange/@dubaifinancialmarket (no such handle), @nyse (unclear).
# Video pages probe, 2026-11-20 (run 44682813823): federalreserve.gov has no
#   robots.txt and advertises its own feeds/videos.xml; the Bank of England's
#   press-conference page embeds a YouTube playlist (videoseries); the ECB,
#   World Bank Live and IMF pages embed no YouTube ids; YouTube oEmbed is
#   allowed by robots.txt.
# YouTube probe, 2026-11-19 (run 44620192311) — official channels for videos:
#   @federalreserve, @imf, @bankofengland  pages resolve to channel ids (now in
#                                       content/videos.yaml); @europeancentralbank
#                                       and @worldbank do not exist (404).
#   /feeds/videos.xml                   robots.txt DISALLOWS it, so videos use the
#                                       YouTube Data API instead (free key).
# Probe round 3, 2026-11-19 (run 44427670166):
#   fed-speeches, cftc-press,          ADDED — robots allow, HTTP 200, fresh, all
#   census-indicators, bis-press,      items dated.
#   fda-press
#   eia-*, bea-news                    robots.txt DISALLOWS the feed paths — skipped.
#   iea-news, opec-press, oecd-news,   HTTP 403 to automated requests — skipped.
#   bna-home
#   imf-news                           404 / 429; kuna-rss 404; wam/spa: no feed.
#   ona-home                           unreachable from the runner.
#   nih-news                           items carry no dates (ingest rejects them).
#   bis-cbspeeches                     newest item 7 days old: outside the 48h
#                                      clustering window, so it would never show.
# Probe round 4, 2026-11-19 (run 44467343815) — markets, deals, global finance:
#   conversation-*-business (4),       ADDED — robots allow, HTTP 200, fresh,
#   ecb-publications, boe-speeches,    all items dated.
#   sec-statements
#   fsb-feed, prnewswire-financial     feed OK; listed in sources.yaml but OFF
#                                      until their reuse terms are confirmed.
#   fca-news                           items undated (ingest rejects them).
#   rba-media, ecb-blog                stale (1 item / a week old).
#   hm-treasury, boe-publications      mostly administrative documents.
#   esma-news-page                     no feed; iosco, wfe, globenewswire 403.
# Probe round 5, 2026-11-19 (run 44474776678) — more Gulf news:
#   qna-sport-local                    ADDED — same agency/terms, 50 dated items.
#   saudi-gazette-business             feed OK; commercial, listed OFF pending
#                                      the owner's terms approval.
#   gulf-times-business                robots.txt DISALLOWS the RSS path.
#   dubai/abu-dhabi media offices,     no feed (pages only).
#   adgm, qfc, peninsula, khaleej
#   dfsa, arab-news                    HTTP 403; difc 429.
#   invest-qatar, gulf-news, zawya,    HTTP 404 for the feed URL.
#   times-of-oman, kuwait-times, gdn
# None of the skipped sources is scraped: without a feed or a published API, a
# source needs either a licence or a terms-of-use check for HTML collection,
# which is the owner's decision.
