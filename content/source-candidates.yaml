# Gulf sources under assessment (Phase 2). NOTHING here is ingested: a source
# moves to content/sources.yaml only after its terms of use have been read, its
# robots.txt allows us, and it has a working feed or an API we may use.
#
# `scripts/probe-sources.ts` (run by .github/workflows/probe-sources.yml on
# GitHub, where these sites are reachable) checks robots.txt, fetches each URL,
# parses it if it is a feed, and lists any feed links if it is a web page.
candidates:
  # --- Official news agencies ---
  - id: qna-rss-hub
    name: Qatar News Agency — RSS index
    url: https://www.qna.org.qa/en/RSS-Feeds
    region: QA
  - id: qna-economy-international
    name: Qatar News Agency — Economy (international)
    url: https://www.qna.org.qa/en/Pages/RSS-Feeds/Economy-International
    region: QA
  - id: qna-economy-local
    name: Qatar News Agency — Economy (local)
    url: https://www.qna.org.qa/en/Pages/RSS-Feeds/Economy-Local
    region: QA
  - id: wam-home
    name: Emirates News Agency (WAM)
    url: https://www.wam.ae/en
    region: AE
  - id: spa-home
    name: Saudi Press Agency (SPA)
    url: https://www.spa.gov.sa/en
    region: SA
  # --- Central banks and regulators ---
  - id: qcb-news
    name: Qatar Central Bank — news
    url: https://www.qcb.gov.qa/en/news
    region: QA
  - id: qfma-news
    name: Qatar Financial Markets Authority — news
    url: https://www.qfma.org.qa/English/News/Pages/default.aspx
    region: QA
  - id: sama-news
    name: Saudi Central Bank (SAMA) — news
    url: https://www.sama.gov.sa/en-US/News/Pages/allnews.aspx
    region: SA
  - id: cma-sa-news
    name: Capital Market Authority (Saudi) — news
    url: https://cma.org.sa/en/MediaCenter/PR/Pages/default.aspx
    region: SA
  - id: cbuae-news
    name: Central Bank of the UAE — news
