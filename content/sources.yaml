# Mizan — feed registry (§10).
# ONLY sources listed here with an explicit license_note may be ingested.
# We weight heavily toward regulators, central banks, exchanges and statistics
# authorities: licence-free, high-trust, and underused by competitors.
#
# tier: wire | outlet | regulator | primary
# We store headline, dek (<=40 words), link, timestamp, source — NEVER body text.

sources:
  - id: sec-press
    name: U.S. SEC — Press Releases
    homepage: https://www.sec.gov
    feed_url: https://www.sec.gov/news/pressreleases.rss
    kind: rss
    region: US
    tier: regulator
    trust_score: 100
    license_note: U.S. government work, public domain. Attribution + link retained.
    active: true
    default_section: markets
    allowed_sections: [markets, economy, crypto]

  # SEC EDGAR filings (owner request, 2026-11-28): new US registration
  # statements for share offerings (S-1, and F-1 for foreign issuers), for the
  # IPO tracker. Read from EDGAR's daily form index under /Archives/ (allowed by
  # robots.txt); the "latest filings" Atom feed under /cgi-bin/ is disallowed and
  # is not used. Each row becomes a factual headline (lib/curation/edgar.ts).
  - id: sec-edgar-registrations
    name: U.S. SEC EDGAR — New S-1 and F-1 registrations
    homepage: https://www.sec.gov/edgar/search/
    feed_url: https://www.sec.gov/Archives/edgar/daily-index/
    kind: api
    region: US
    tier: primary
    trust_score: 95
    license_note: U.S. government work (EDGAR daily form index), public domain. Headline written from the index row; link to the filing on sec.gov.
    active: true
    default_section: ibanking
    allowed_sections: [ibanking]
    max_items_per_run: 20
    lookback_days: 14

  # Investcorp (Bahrain-based alternative-investment firm), owner request
