# Official-institution YouTube channels (owner choice, 2026-11-19: "Option 1").
#
# A channel is read only when listed here with a licence note and active: true.
# The macro job (every 6 hours) reads each channel's latest uploads through the
# YouTube Data API v3 (free key, YOUTUBE_API_KEY) — not the RSS feeds, whose
# path YouTube's robots.txt disallows. It stores references only (video id,
# title, time, thumbnail URL), refreshed or deleted within 30 days per the
# YouTube API Services policies. Videos play in YouTube's own embedded player
# (youtube.com/embed) only when a reader presses play, with a "Watch on
# YouTube" link beside every card.
#
# Safety: a channel is used only when YouTube's own title for it is one of
# `expect_titles` — a wrong id or handle is skipped, never shown.
#
# Channel ids and titles below were read from each institution's YouTube page
# by the probes of 2026-11-19 and 2026-11-20 (runs 44620192311, 44684967386).
# Rejected there: handles that belong to someone else (@opec, @iea, @difc,
# @adxuae, and @bankofengland — its uploads are not the Bank of England's;
# removed 2026-11-20) or do not exist (ECB, BIS, US Treasury, SEC, Bank of Canada, RBA,
# Bank of Japan, Saudi Exchange, DFM).
#
# Without a YouTube API key each channel shows as its uploads playlist with
# its newest video's picture and title (oEmbed, macro job). `expect_titles`
# lists only the institution's proper name(s) — never a handle-style variant,
# which a look-alike channel can carry. The homepage shows
# the first six channels in this order; /videos shows all.
channels:
  - id: federal-reserve
    name: Federal Reserve
    channelId: UCAzhpt9DmG6PnHXjmJTvRGQ
    expect_titles: [Federal Reserve]
    license_note: Official US Federal Reserve channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: imf
    name: IMF
    channelId: UCIYhr3JsLYfKkCM7-W5B6DA
    expect_titles: [IMF, International Monetary Fund]
    license_note: Official International Monetary Fund channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: qatar-stock-exchange
    name: Qatar Stock Exchange
    channelId: UCVwO-M55IgGX8Zh_TlANqzQ
    expect_titles: [Qatar Stock Exchange]
    license_note: Official Qatar Stock Exchange channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: world-bank
    name: World Bank
    channelId: UCE9mrcoX-oE-2f1BL-iPPoQ
    expect_titles: [World Bank Group, World Bank, The World Bank]
    license_note: Official World Bank Group channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: adgm
    name: ADGM
    channelId: UCqwnzB7WLu1U4XPzweDjDtA
    expect_titles: [ADGM, Abu Dhabi Global Market]
    license_note: Official Abu Dhabi Global Market channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: oecd
    name: OECD
    channelId: UCR-Ja1yBcjkhuQblxnroZJg
    expect_titles: [OECD]
    license_note: Official OECD channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: wto
    name: World Trade Organization
    channelId: UCS3LJf8IInqTB0fjJeZpSFw
    expect_titles: [World Trade Organization, WTO]
    license_note: Official World Trade Organization channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: world-economic-forum
    name: World Economic Forum
    channelId: UCw-kH-Od73XDAt7qtH9uBYA
    expect_titles: [World Economic Forum]
    license_note: Official World Economic Forum channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
  - id: nasdaq
    name: Nasdaq
    channelId: UCDhqADfY8S2N8BfrffZAc2w
    expect_titles: [Nasdaq]
    license_note: Official Nasdaq channel; embedded with YouTube's player under the YouTube Terms of Service. References only.
